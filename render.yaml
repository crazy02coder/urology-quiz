services:
  - type: web
    name: bilkent-canli-egitim
    runtime: python
    buildCommand: pip install -r requirements.txt -c constraints.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
    plan: 0.5c-512mb
    numInstances: 1
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    disk:
      name: exam-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        value: sqlite:////data/exam.db
      - key: COOKIE_SECURE
        value: "true"
      - key: PORT
        value: "10000"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
